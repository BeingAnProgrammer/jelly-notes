<header class="topbar">
  <button type="button" class="icon-btn menu-btn" title="Open menu" (click)="mobileNav.toggle()">
    <app-icon name="menu" [size]="17" [strokeWidth]="1.9" />
  </button>

  <div class="breadcrumb">
    <span class="crumb-root">{{ crumbRoot() }}</span>
  </div>

  <div class="actions">
    <button type="button" class="icon-btn" title="Search" (click)="paletteService.open()">
      <app-icon name="search" [size]="16" [strokeWidth]="1.9" />
    </button>
    <button type="button" class="icon-btn" title="Notifications">
      <app-icon name="bell" [size]="16" [strokeWidth]="1.9" />
      <span class="notif-dot"></span>
    </button>
  </div>
</header>
