<a class="row" [routerLink]="[assignment().id]">
  <div class="date-badge" [style.background]="assignment().tagBg">
    <span class="day" [style.color]="assignment().tagColor">{{ day() }}</span>
    <span class="month" [style.color]="assignment().tagColor">{{ month() }}</span>
  </div>

  <div class="meta">
    <div class="title">{{ assignment().title }}</div>
    <div class="pills">
      <app-pill [bg]="assignment().tagBg" [color]="assignment().tagColor" [bordered]="false">
        {{ assignment().context }}
      </app-pill>
      <app-pill [bg]="assignment().statusBg" [color]="assignment().statusColor" [bordered]="false">
        {{ assignment().status }}
      </app-pill>
      <span class="task-count">{{ assignment().taskCountLabel }}</span>
    </div>
  </div>

  <div class="progress-block">
    <div class="progress-header">
      <span>Progress</span>
      <span>{{ assignment().percentComplete }}%</span>
    </div>
    <app-progress-bar
      [percent]="assignment().percentComplete"
      [color]="assignment().barColor"
      [label]="assignment().title + ' progress'"
    />
  </div>

  <span class="due" [style.color]="assignment().dueColor">{{ dueLabel() }}</span>

  <app-icon name="chevron-right" [size]="16" [strokeWidth]="1.8" />
</a>
