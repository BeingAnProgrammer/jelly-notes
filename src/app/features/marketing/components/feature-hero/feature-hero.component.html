<main class="hero">
  <p class="eyebrow">{{ eyebrow() }}</p>
  <h1>
    {{ headlineTop() }}
    @if (headlineBottom()) {
      <br />{{ headlineBottom() }}
    }
  </h1>
  <p class="subtext">{{ subtext() }}</p>

  <div class="cta-block">
    <a class="cta-btn" [routerLink]="ctaLink()">
      {{ ctaLabel() }}
      <app-icon name="arrow-right" [size]="16" [strokeWidth]="2" />
    </a>
    <p class="footnote">{{ footnote() }}</p>
  </div>
</main>
