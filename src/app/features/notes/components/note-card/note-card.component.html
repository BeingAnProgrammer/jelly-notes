<a class="card" [class.pinned]="note().pinned" [style.--dot]="note().dot" [routerLink]="['/notes', note().id]">
  <div class="top-row">
    <span class="dot" [style.background]="note().dot"></span>
    <span class="folder" [style.color]="note().dot">{{ note().folder }}</span>
    @if (note().pinned) {
      <app-icon name="pin" [size]="11" [strokeWidth]="1.9" [filled]="true" class="pin" />
    }
  </div>

  <h2 class="title">{{ note().title }}</h2>
  @if (note().excerpt) {
    <p class="excerpt">{{ note().excerpt }}</p>
  } @else {
    <p class="excerpt empty">No content yet — click to start writing.</p>
  }

  <div class="footer">
    <div class="tags">
      @for (tag of note().tags; track tag) {
        <span class="tag" [style.color]="note().dot">{{ tag }}</span>
      }
    </div>
    <span class="updated">{{ relativeTime(note().updatedAt) }}</span>
  </div>
</a>
