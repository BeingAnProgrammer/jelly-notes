<div class="card">
  <div class="brand">
    <app-icon name="logo" [size]="22" [filled]="true" />
    <span>Jelly Notes</span>
  </div>

  <h1>Welcome back</h1>
  <p class="subtext">Sign in to your calm workspace.</p>

  <form class="form" (submit)="onSubmit($event)">
    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" name="email" placeholder="name@example.com" autocomplete="email" />
    </label>

    <label class="field">
      <span class="field-label-row">
        <span class="field-label">Password</span>
        <button type="button" class="forgot-link" (click)="toggleForgotHint()">Forgot password?</button>
      </span>
      <span class="password-input">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="17" [strokeWidth]="1.8" />
        </button>
      </span>
      @if (showForgotHint()) {
        <span class="hint">This is a guest preview — any password works.</span>
      }
    </label>

    <button type="submit" class="submit-btn">Sign in</button>
  </form>

  <div class="divider"><span>Or continue with</span></div>

  <button type="button" class="google-btn" (click)="continueToDashboard()">
    <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
      <path
        fill="#EA4335"
        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
      />
      <path
        fill="#4285F4"
        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
      />
      <path
        fill="#FBBC05"
        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
      />
      <path
        fill="#34A853"
        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
      />
    </svg>
    Google
  </button>

  <p class="guest-row">
    No account needed —
    <button type="button" class="guest-link" (click)="goToGuestName()">continue as guest</button>
  </p>
</div>
