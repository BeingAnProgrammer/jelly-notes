<div class="glow" aria-hidden="true"></div>

<div class="content">
  <div class="brand">
    <div class="brand-mark">
      <app-icon name="logo" [size]="20" [strokeWidth]="2.2" />
    </div>
    <span class="brand-name">Memora</span>
  </div>

  <h1>Everything you know, in one calm workspace.</h1>
  <p class="subtext">
    Notes, folders, tasks, and assignments — with an AI that has actually read everything you've written.
  </p>

  <button type="button" class="sign-in-btn" (click)="signIn()">
    Sign in
    <app-icon name="arrow-right" [size]="16" [strokeWidth]="2" />
  </button>

  <p class="footnote">No account needed for this preview.</p>
</div>
